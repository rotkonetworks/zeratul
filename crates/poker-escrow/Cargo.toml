[package]
name = "poker-escrow"
version = "0.1.0"
edition = "2021"
description = "Poker escrow service — FROST 2-of-3 key management, deposit tracking, payout signing"

[dependencies]
# FROST / crypto
osst = { path = "../osst", features = ["pallas"] }
pasta_curves = "0.5"
ff = "0.13"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
# AEAD for encrypting persisted FROST key-shares at rest (opt-in via ESCROW_PERSIST_KEY)
chacha20poly1305 = "0.10"
# player settlement co-signing (Ed25519 session keys, matches WebCrypto 'Ed25519')
ed25519-dalek = "2"

# FROST + Orchard UA derivation (shared with zcli, zafu, zigner).
# Ironwood cutover: retargeted from the NU6.3 fork revs to the local
# rotkonetworks/zcli master (released Ironwood stack — orchard 0.15.5 upstream)
# via path deps so frost-spend + zecli link against the SAME released
# orchard/zcash_primitives crates.io crates as the direct deps below (path deps,
# so the sibling checkout's manifest/lock are used directly and the whole graph
# resolves to one orchard 0.15.x instance).
frost-spend = { path = "/steam/rotko/zcli/crates/frost-spend" }
# zidecar gRPC client + Orchard compact-block scanner (mirrors zcli/bin/license-server)
zecli = { path = "/steam/rotko/zcli/bin/zcli" }

# ── NU6.3 / Ironwood zcash stack — released crates.io (no forks, no [patch], no cfg) ──
# Migrated OFF the valar NU6.3 fork (orchard 0.14 / zcash_primitives 0.28 /
# zcash_protocol 0.9 / pczt 0.7, built with RUSTFLAGS='--cfg zcash_unstable="nu6.3"')
# ONTO the released Ironwood stack — the SAME crates.io versions
# zcli/crates/zcash-wasm (zafu) uses. NU6.3 / Ironwood is fully ungated upstream:
#   orchard 0.15.5 carries the qleak dummy-ciphertext privacy fix and the
#   Ironwood note/domain/output builders (V3 notes, add_ironwood_output, ...).
#   zcash_protocol 0.10 ships the real NU6.3 branch id (0x37a5165b, mainnet
#   activation 3_428_143) and the V6 version group id — no zcash_unstable cfg.
orchard = { version = "0.15.5", default-features = false, features = ["circuit"] }
zcash_address = { version = "0.13", default-features = false }
zcash_protocol = { version = "0.10", default-features = false }
zcash_note_encryption = "0.4"
blake2b_simd = "1"

# PCZT standard pipeline — same released versions as zcash-wasm / zafu.
zcash_primitives = { version = "0.30", default-features = false, features = ["non-standard-fees"] }
pczt = { version = "0.9", default-features = false, features = ["orchard", "transparent", "zcp-builder", "prover", "io-finalizer", "signer", "tx-extractor", "spend-finalizer"] }

# web server
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
# WS client for the FROST relay (used in Phase 2.2 onward)
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# ntfy dispute alerts (outbound HTTP POST; rustls to stay openssl-free)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# operator-PIN hashing for the dispute dashboard (never store raw PIN)
argon2 = "0.5"

# zidecar gRPC client (deposit watching)
# tonic = "0.12"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI / env
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

# NU6.3 / Ironwood is fully ungated on the released stack (orchard 0.15.5 +
# zcash_protocol 0.10), so the `zcash_unstable = "nu6.3"` cfg and the librustzcash
# [patch] block are no longer needed and have been removed.

