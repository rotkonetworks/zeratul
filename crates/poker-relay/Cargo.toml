[package]
name = "poker-relay"
version = "0.1.0"
edition = "2021"
description = "Minimal WebSocket relay for P2P poker signaling"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "cors"] }
futures-util = "0.3"
rand = "0.8"
